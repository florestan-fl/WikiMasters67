<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>WikiMasters Trading</title>
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>WikiMasters Trading</h1>
    <button id="open-settings" class="link" title="Paramètres" aria-label="Paramètres">⚙ Paramètres</button>
  </header>

  <div id="permission" class="notice warn" hidden>
    L'extension a besoin d'accéder à wiki-masters.com pour lire les données de vos pages.
    <div class="actions"><button id="grant">Autoriser</button></div>
  </div>

  <ul id="status" class="status"></ul>
  <div id="notices"></div>

  <div class="actions stack">
    <button id="dashboard" class="primary">Tableau de bord</button>
    <div class="actions">
      <button id="market">Prix du marché</button>
      <button id="marketplace" title="Ouvre (ou affiche) votre onglet Marché de WikiMasters">Aller au Marché ↗</button>
    </div>
    <button id="export" hidden>Envoyer vers Google Sheets</button>
  </div>

  <div id="groups-due"></div>
  <div id="last-search"></div>
  <div id="deals"></div>
  <div id="recent"></div>

  <p id="how" class="small muted how">Les données arrivent quand vous ouvrez le Marché de WikiMasters : l'extension lit les réponses que votre navigateur reçoit, sans rien envoyer au jeu.</p>

  <script src="lib/time.js"></script>
  <script src="lib/settings.js"></script>
  <script src="lib/extract.js"></script>
  <script src="lib/store.js"></script>
  <script src="lib/market.js"></script>
  <script src="lib/searches.js"></script>
  <script src="lib/stats.js"></script>
  <script src="lib/format.js"></script>
  <script src="popup.js"></script>
</body>
</html>
