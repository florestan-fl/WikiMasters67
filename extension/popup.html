<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>WikiMasters Trading</title>
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>WikiMasters Trading</h1>
    <a href="#" id="open-options" class="small">Paramètres</a>
  </header>

  <div id="permission" class="notice warn" hidden>
    L'extension a besoin d'accéder à wiki-masters.com (et à script.google.com pour l'export).
    <div class="actions"><button id="grant">Autoriser</button></div>
  </div>

  <div id="no-cards" class="notice warn" hidden>
    Aucune carte suivie pour l'instant. Ajoutez les cartes que vous échangez dans les <a href="#" id="open-options-2">paramètres</a>.
  </div>

  <div class="actions">
    <button id="sync" class="primary">Mettre à jour</button>
    <button id="dashboard">Tableau de bord</button>
  </div>

  <div id="status" class="small muted"></div>
  <div id="tiles" class="tiles"></div>
  <div id="result"></div>

  <footer class="small muted" id="footer"></footer>

  <script src="lib/extract.js"></script>
  <script src="lib/time.js"></script>
  <script src="lib/settings.js"></script>
  <script src="lib/store.js"></script>
  <script src="lib/stats.js"></script>
  <script src="lib/format.js"></script>
  <script src="popup.js"></script>
</body>
</html>
